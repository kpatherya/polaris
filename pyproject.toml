[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "polaris"
version = "0.1.0"
description = "Cross-temporal landmark matching experiments and CLI toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "POLARIS contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "scikit-learn>=1.2",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.21",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.66",
    "transformers>=4.48.3",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[project.scripts]
polaris = "polaris.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
